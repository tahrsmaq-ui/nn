<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسف من كل قلبي ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* خلفية القلوب المتحركة */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: float 6s infinite linear;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* بطاقة الاعتذار */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
        }

        .btn-yes:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            position: absolute;
            transition: 0.2s ease;
        }

        /* رسالة النجاح */
        .success-message {
            display: none;
            animation: popIn 0.5s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-message h2 {
            color: #d63384;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div id="apology-content">
            <div class="avatar">🥺👉👈</div>
            <h1>أنا آسف جداً..</h1>
            <p id="apology-text">
                علمتُ أنني أخطأت، ولأنكِ أغلى ما أملك، لا أستطيع تحمّل زعلِكِ لحظة واحدة.<br>
                أتمنى أن تقبلي اعتذاري وتسامحيني ❤️
            </p>
            <div class="buttons" id="btn-container">
                <button class="btn btn-yes" onclick="acceptApology()">سامحتك ❤️</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()">لسه زعلانة 🥺</button>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            <div style="font-size: 70px;">💖✨🎉</div>
            <h2>شكراً لأنكِ سامحتيني!</h2>
            <p>أوعدك أكون دائماً السبب في ابتسامتك وما أزعلِك أبداً ❤️</p>
        </div>
    </div>

    <script>
        // جعل الزر "لسه زعلانة" يهرب عند محاولة الضغط عليه
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('btn-container');
            
            // حساب حدود الحركة داخل البطاقة
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // عند الضغط على "سامحتك"
        function acceptApology() {
            document.getElementById('apology-content').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            createBurstHearts();
        }

        // إنشاء قلوب متطايرة في الخلفية
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);

        function createBurstHearts() {
            for(let i = 0; i < 30; i++) {
                setTimeout(createHeart, i * 50);
            }
        }
    </script>
</body>
</html>
